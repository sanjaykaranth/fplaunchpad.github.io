title: FP Launchpad
email: contact@fplaunchpad.org
description: Centre for Functional Systems Research and Education at IIT Madras
baseurl: ""
url: "https://fplaunchpad.org"
logo: /assets/images/logo-400.png

# Build settings
markdown: kramdown
kramdown:
  auto_ids: true
theme: minima

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  blog:
    output: true
    permalink: /blog/:slug/

# Navigation
header_pages:
  - charter.md
  - updates.md

# Social links
twitter_username: fp_launchpad
linkedin_url: https://www.linkedin.com/company/fp-launchpad/
youtube_url: https://www.youtube.com/@fplaunchpad
github_url: https://github.com/orgs/fplaunchpad/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

# Site-wide announcement strip below the menu bar (_includes/header.html). Delete this block to remove it.
announcement:
  text: "Applications are open for the second cohort of the Post-Baccalaureate Fellowship"
  link: /2026/09/24/applications-open-post-bacc-fellowship-cohort-2.html
